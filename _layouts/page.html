---
layout: default
---
<!-- page.html -->
        <div class="post page-content-shell">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
          </header>

          <article class="page-article{% if page.permalink == '/projects/' %} page-article--wide{% endif %}">
            {{ content }}
          </article>

        </div>
