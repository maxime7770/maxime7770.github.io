<footer class="site-footer{% if site.footer_fixed %} fixed-bottom{% else %} sticky-bottom{% endif %}">
  <div class="container footer-inner">
    <div class="footer-identity">
      <a class="footer-name" href="{{ '/' | relative_url }}">{{ site.first_name }} {{ site.last_name }}</a>
      <p>Machine learning, optimization, and technical work.</p>
    </div>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="mailto:maximew@alum.mit.edu">Email</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
    <p class="footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.last_name }}</p>
  </div>
</footer>
